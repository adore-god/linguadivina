<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Generated Snippets</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; padding: 16px; }
  .snippet { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  .snippet-header { display: flex; justify-content: space-between; align-items: center; }
  h2 { font-size: 15px; margin: 0; }
  button { padding: 6px 14px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 14px; }
  button.copied { background: #16a34a; }
  textarea { width: 100%; box-sizing: border-box; margin-top: 8px; font-family: monospace; font-size: 13px; }
</style>
</head>
<body>
<h1>Generated Snippets</h1>

    <div class="snippet">
      <div class="snippet-header">
        <h2>Title (from &lt;h1&gt;)</h2>
        <button onclick="copySnippet('snippet0', this)">Copy</button>
      </div>
      <textarea id="snippet0" readonly rows="2">John 6:60-71 — The Hard Saying — The Court Divides What It Has Spoken</textarea>
    </div>

    <div class="snippet">
      <div class="snippet-header">
        <h2>Plus slug</h2>
        <button onclick="copySnippet('snippet1', this)">Copy</button>
      </div>
      <textarea id="snippet1" readonly rows="2">plus-john-6-60-71</textarea>
    </div>

    <div class="snippet">
      <div class="snippet-header">
        <h2>Free slug</h2>
        <button onclick="copySnippet('snippet2', this)">Copy</button>
      </div>
      <textarea id="snippet2" readonly rows="2">subscribe-john-6-60-71.html</textarea>
    </div>

    <div class="snippet">
      <div class="snippet-header">
        <h2>Paywall CTA block</h2>
        <button onclick="copySnippet('snippet3', this)">Copy</button>
      </div>
      <textarea id="snippet3" readonly rows="6">&lt;div class="paywall-cta"&gt;
  &lt;p&gt;Continue reading the full breakdown on &lt;/p&gt;
    &lt;div class="site-name" style=""  &gt;Lingua Divina &lt;br&gt;&lt;span style="text-transform: lowercase; font-weight:200"&gt;Plus&lt;/span&gt;&lt;/div&gt;
  &lt;a onclick="gtag('event', 'plus_subscribe_article');" class="paywall-btn" href="https://plus.linguadivina.uk/plus-john-6-60-71"&gt;Subscribe&lt;/a&gt;
&lt;/div&gt;</textarea>
    </div>

    <div class="snippet">
      <div class="snippet-header">
        <h2>Badge link</h2>
        <button onclick="copySnippet('snippet4', this)">Copy</button>
      </div>
      <textarea id="snippet4" readonly rows="2">&lt;span class="badge"&gt;&lt;a href="https://plus.linguadivina.uk/plus-john-6-60-71"&gt;PLUS&lt;/a&gt;&lt;/span&gt;</textarea>
    </div>

    <div class="snippet">
      <div class="snippet-header">
        <h2>JSON entry</h2>
        <button onclick="copySnippet('snippet5', this)">Copy</button>
      </div>
      <textarea id="snippet5" readonly rows="2">{ "slug": "plus-john-6-60-71", "title": "John 6:60-71 — The Hard Saying — The Court Divides What It Has Spoken", "freeSlug": "plus/subscribe-john-6-60-71.html" },</textarea>
    </div>

    <div class="snippet">
      <div class="snippet-header">
        <h2>List item</h2>
        <button onclick="copySnippet('snippet6', this)">Copy</button>
      </div>
      <textarea id="snippet6" readonly rows="2">&lt;li&gt;&lt;a href="../plus/subscribe-john-6-60-71.html"&gt;John 6:60-71 — The Hard Saying — The Court Divides What It Has Spoken&lt;/a&gt;&lt;span class="badge"&gt;&lt;a href="https://plus.linguadivina.uk/plus-john-6-60-71"&gt;PLUS&lt;/a&gt;&lt;/span&gt;&lt;/li&gt;</textarea>
    </div>
<script>
function copySnippet(id, btn) {
  var el = document.getElementById(id);
  el.focus();
  el.select();
  el.setSelectionRange(0, 999999);
  document.execCommand('copy');
  var original = btn.textContent;
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(function() {
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 1200);
}
</script>
</body>
</html>
