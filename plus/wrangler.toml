name = "plus"
main = "src/index.js"
compatibility_date = "2026-07-01"

# This mounts the Worker on the plus.linguadivina.uk subdomain itself
# (root path), not as a subpath of the main linguadivina.uk site.
# Requires linguadivina.uk's DNS to be on Cloudflare (it already is), and
# a DNS record for the "plus" subdomain (proxied/orange-cloud).
routes = [
  { pattern = "plus.linguadivina.uk/*", zone_name = "linguadivina.uk" }
]

# KV namespaces — create these first (wrangler kv namespace create SUBSCRIBERS),
# then paste the id below.
kv_namespaces = [
  { binding = "SUBSCRIBERS", id = "88b400a875094751afac46cfd28272f8" }
]

# Articles now live as plain files in the articles/ folder of this repo
# instead of KV. Add a new one by dropping in a <slug>.html file and a
# matching entry in articles/manifest.json, then push — Cloudflare
# Workers Builds will pick up the folder and redeploy automatically.
[assets]
directory = "./articles"
binding = "ARTICLES"
# Without this, Cloudflare serves any request that matches a file in
# ./articles directly as a raw static file — BEFORE the Worker even runs.
# That bypasses both the paywall check and the page template (styling,
# header/footer). This forces every request through the Worker first,
# which then fetches from ARTICLES itself when it needs to.
run_worker_first = true

# Non-secret config
[vars]
STRIPE_PRICE_ID = "price_1TwcoI0AECUG2ECzOpZhqgvp"
SITE_URL = "https://plus.linguadivina.uk"

# Secrets are NOT set here. Run these once from your terminal instead:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put COOKIE_SECRET
