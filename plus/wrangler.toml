name = "plus"
main = "src/index.js"
compatibility_date = "2026-07-01"

# This mounts the Worker on a subpath of your existing domain.
# Requires linguadivina.uk's DNS to be on Cloudflare (it already is).
routes = [
  { pattern = "linguadivina.uk/plus*", zone_name = "linguadivina.uk" }
]

# KV namespaces — create these first (wrangler kv namespace create SUBSCRIBERS
# and wrangler kv namespace create ARTICLES), then paste the ids below.
kv_namespaces = [
  { binding = "SUBSCRIBERS", id = "88b400a875094751afac46cfd28272f8" },
  { binding = "ARTICLES", id = "591ca05207f64eb494f3963d6a0acece" }
]

# Non-secret config
[vars]
STRIPE_PRICE_ID = "price_1TwUCY0AECUG2ECzlPggvdTb"
SITE_URL = "https://linguadivina.uk"

# Secrets are NOT set here. Run these once from your terminal instead:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put COOKIE_SECRET
