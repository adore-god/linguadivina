  * { box-sizing: border-box; }

  body {
  min-height: 100vh;

    --room-light 16s linear, --room-glow 16s linear, --room-edge 16s linear,

    --frame-glow 16s linear, --ledge-top 16s linear, --ledge-bot 16s linear,

  -moz-text-size-adjust: 100%;

}


  /* ---------- stone wall backdrop ---------- */
  .backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  transition: background 4s ease;
  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(255, 255, 255, 0.15) 0%,
      rgba(255, 255, 255, 0.06) 35%,
      transparent 70%
    ),
    linear-gradient(
      180deg,
      #5d6064 0%,
      #474a4e 55%,
      #313438 100%
    );
  filter: brightness(var(--room-brightness));
}

.backdrop::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--room-wash);
  mix-blend-mode: soft-light;
  pointer-events: none;
}

body.is-night .backdrop {
  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(255, 255, 255, 0.04) 0%,
      rgba(255, 255, 255, 0.015) 30%,
      transparent 65%
    ),
    linear-gradient(
      180deg,
      #1b1d20 0%,
      #111316 55%,
      #07080a 100%
    );
}

  /* ---------- wall cracks ---------- */
  .wall-cracks {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.2; 
    transition: opacity 4s ease;
  }
  .wall-cracks svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .crack {
    fill: none;
    stroke: rgba(0,0,0,0.75);
    stroke-width: 0.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .crack-highlight {
    fill: none;
    stroke: rgba(255,255,255,0.2);
    stroke-width: 0.14;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  body.is-night .wall-cracks { opacity: 0.25; }

.candlelight-ambient {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  mix-blend-mode: screen;

  opacity: 0.18;
  transition: opacity 3s ease;

  background:
    radial-gradient(
      ellipse at 50% 90%,
      rgba(255,150,70,0.55) 0%,
      rgba(255,120,40,0.16) 32%,
      transparent 65%
    );

  transform-origin: 50% 100%;
  animation: candleSway 6s ease-in-out infinite,
             candleFlicker 2.4s ease-in-out infinite alternate;
}

body.is-night {
  background: #08090b;
}

body.is-night .candlelight-ambient {
  opacity: 0.72;
}

@keyframes candleSway {
  0% {
    transform: translateX(-4px) rotate(-0.5deg) scale(1);
  }
  25% {
    transform: translateX(2px) rotate(0.3deg) scale(1.02);
  }
  50% {
    transform: translateX(5px) rotate(0.6deg) scale(0.99);
  }
  75% {
    transform: translateX(-2px) rotate(-0.3deg) scale(1.01);
  }
  100% {
    transform: translateX(-4px) rotate(-0.5deg) scale(1);
  }
}

@keyframes candleFlicker {
  0% {
    opacity: 0.68;
    filter: blur(0px);
  }
  30% {
    opacity: 0.74;
  }
  60% {
    opacity: 0.66;
    filter: blur(1px);
  }
  100% {
    opacity: 0.72;
    filter: blur(0px);
  }
}


.candlelight-ambient::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity:0;
  background:
    radial-gradient(
      ellipse at var(--x,50%) var(--y,90%),
      rgba(255,155,75,.55) 0%,
      rgba(255,120,40,.16) 32%,
      transparent 65%
    );

  animation: flame 5s ease-in-out infinite;
}

@keyframes flame {
  0% {
    --x: 49%;
    --y: 91%;
    transform: scale(1);
  }
  20% {
    --x: 50.5%;
    --y: 89%;
    transform: scale(1.02);
  }
  40% {
    --x: 48.8%;
    --y: 90%;
    transform: scale(0.99);
  }
  60% {
    --x: 51.2%;
    --y: 88.8%;
    transform: scale(1.03);
  }
  80% {
    --x: 49.5%;
    --y: 90.5%;
    transform: scale(1.01);
  }
  100% {
    --x: 49%;
    --y: 91%;
    transform: scale(1);
  }
}

.vignette {
    position: fixed;
    inset: 0;
    z-index: 0; 
    pointer-events: none;
    opacity: 1;
    background:
      linear-gradient(
        90deg,
        transparent 0%,
        var(--room-glow) 20%,
        var(--room-glow) 80%,
        transparent 100%
      ),
      radial-gradient(ellipse at 50% 55%, transparent 38%, var(--room-edge) 100%);
  }

body.is-night .candlelight-ambient::before {
  opacity:1;
}
  /* ---------- sanctuary layout ---------- */
  .sanctuary {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 0px; /* Reduced from min(56px, 6vh) */
  padding-top: 10px;  /* Reduced from max(16px, 2vh) */
  width: 100%;
}


  /* ---------- gothic window (ORIGINAL STYLES) ---------- */
  .window-frame {
  position: relative;
  z-index:1;
  width: clamp(180px, 40vw, 300px);
  height: clamp(300px, min(48vh, calc(100dvh - 200px)), 460px);
  max-height: calc(90dvh - 300px);
  padding: 14px;
  box-sizing: border-box;
  display: flex;
  clip-path: var(--arch-clip);

  background: linear-gradient(
    135deg,
    var(--frame-top) 0%,
    var(--frame-mid) 45%,
    var(--frame-bot) 100%
  );

  transition: background 4s ease;

  box-shadow:
    inset 0 2px 1px var(--frame-highlight),
    inset 0 -4px 8px var(--frame-inset-shadow),
    0 18px 42px var(--frame-outer-shadow),
    0 0 60px 10px var(--frame-glow);
}

  @media (max-height: 700px) {
    .sanctuary {
      padding-top: 10px;
      padding-bottom: 0px;
    }
    .altar-candles {
      margin-top: 10px;
      height: 240px;
    }
    .candle-wrap {
      height: 240px;
      transform: scale(0.85);
      transform-origin: bottom center;
    }
    .hour-label {
      margin-top: 8px;
    }
  }



  .finial {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 24px;
    background: linear-gradient(180deg, #cdb27e, #8a7248);
    box-shadow: 0 0 6px rgba(0,0,0,0.4);
    z-index: 10;
  }
  .finial::before {
    content: "";
    position: absolute;
    top: 6px;
    left: -7px;
    width: 18px;
    height: 4px;
    background: linear-gradient(90deg, #8a7248, #cdb27e, #8a7248);
  }

  .window-leading {
    width: 100%;
    height: 100%;
    padding: 2px;
    box-sizing: border-box;
    clip-path: var(--arch-clip);
    background: conic-gradient(
      from 0deg,
      var(--lead-base),
      var(--lead-highlight),
      var(--lead-base),
      var(--lead-dark1),
      var(--lead-dark2),
      var(--lead-dark1),
      var(--lead-base)
    );
    transition: background 4s ease;
    display: flex;
  }

  .window-glass {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    clip-path: var(--arch-clip);
    background: #000;
  }

  .sky {
    position: absolute;
    z-index:1;
    inset: 0;
    background: linear-gradient(to bottom, var(--c-top) 0%, var(--c-mid) 55%, var(--c-bot) 100%);
    transition: --c-top 16s linear, --c-mid 16s linear, --c-bot 16s linear;
  }

  .stars {
    position: absolute;
    z-index:3;
    inset: 0;
    opacity: 0;
    transition: opacity 8s ease;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #fff;

    box-shadow:
        0 0 3px rgba(255,255,255,.9),
        0 0 7px rgba(255,255,255,.6),
        0 0 14px rgba(255,255,255,.25);

    animation: twinkle 6s ease-in-out infinite;
}

@keyframes twinkle {

    0%,100% {
        opacity: .55;
        transform: scale(1);
    }

    46% {
        opacity: .75;
    }

    48% {
        opacity: .95;
    }

    /* Tiny glint */
    50% {
        opacity: 1;
        transform: scale(1.15);
    }

    52% {
        opacity: .82;
    }

    60% {
        opacity: .65;
    }
}

.star:nth-child(3n) {
    animation-duration: 7.4s;
}

.star:nth-child(5n) {
    animation-duration: 9.1s;
}

.star:nth-child(7n) {
    animation-duration: 5.8s;
}

.star:nth-child(2n) {
    animation-delay: -2.3s;
}

.star:nth-child(4n) {
    animation-delay: -5.7s;
}

.star:nth-child(6n) {
    animation-delay: -1.4s;
}

  .horizon-glow {

  .moon-shadow {

.flame-core {

    background: radial-gradient(

}

    55%  { transform: rotate(24deg) scaleY(0.85) skewX(8deg); }

    55%  { transform: translate(0px, 0px) rotate(22deg) scaleY(0.85) skewX(8deg); }
    85%  { transform: translate(1px, -1px) rotate(-10deg) scaleY(0.65) skewX(-2deg); }

}

/* 2. DAY (Solid opaque muted colors — mix-blend-mode removed to prevent disappearing) */

/* ---------- butterfly (a small, wandering visitor at the window) ---------- */
.butterfly-wrap {
    position: absolute;
    z-index: 4;
    width: 7%;
    aspect-ratio: 1 / 1;
    right -10%;
    top: 38%;
    opacity: 0;
    rotate: -68deg;

    will-change: opacity, transform;
    animation: butterflyFlutter 30s ease-in-out infinite;
    animation-delay: 42s;
}

    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
}
 
.butterfly-wing {

} 

/* Default fallback colors (monarch-ish) */


.butterfly-wing-left  { fill: rgba(168, 140, 122, 0.90); stroke: none; }
.butterfly-wing-right { fill: rgba(168, 140, 122, 0.90); stroke: none; }
.butterfly-wing-spot  { fill: rgba(237, 231, 222, 0.85); stroke: none; }

.butterfly-wing-right,
.butterfly-wing-spot,

/* ---------- Trailing Vine & Wild Rose ---------- */
.trailing-vine {
  position: absolute;
  top: 0;
  right: 0;
  width: 53%;
  height: 70%;
  pointer-events: none;
  z-index: 9; 
  opacity: 0.8;
  transition: opacity 4s ease;
}

.trailing-vine svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Stems & Tendrils */
.vine-stem {
  fill: none;
  stroke: #2d3829;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 4s ease;
}

.vine-tendril {
  fill: none;
  stroke: #3c4c37;
  stroke-width: 0.8;
  stroke-linecap: round;
  transition: stroke 4s ease;
}

/* Leaves & Leaf Details */
.vine-leaf-base {
  fill: #3e5239;
  transition: fill 4s ease;
}

.vine-leaf-dark {
  fill: #2d3e2a;
  transition: fill 4s ease;
}

.leaf-vein {
  fill: none;
  stroke: #1f2c1c;
  stroke-width: 0.5;
  stroke-linecap: round;
  opacity: 0.6;
  transition: stroke 4s ease;
}

/* Detailed Flower Petals & Center */
.flower-petal {
opacity: 1;
  fill: #d69da9;
  stroke: #b57b88;
  stroke-width: 0.4;
  transition: fill 4s ease, stroke 4s ease;
}

.flower-petal-inner {
  fill: #e8bdc5;
  transition: fill 4s ease;
}

.flower-center {
  fill: #eac668;
  stroke: #8c6a28;
  stroke-width: 0.3;
  transition: fill 4s ease, stroke 4s ease;
}

.flower-bud {
  fill: #ba838f;
  transition: fill 4s ease;
}

.petal-vein {
  fill: none;
  stroke: #b57b88;
  stroke-width: 0.35;
  stroke-linecap: round;
  opacity: 0.5;
  transition: stroke 4s ease;
}

/* Animation to make the vine sway gently */
.trailing-vine {
transform: rotate(-10deg) scale(1);
  transform-origin: top right; /* Keeps the vine anchored at the top right of the window */
  animation: vineSway 10s ease-in-out infinite alternate;

  
}

@keyframes vineSway {
  0%   { transform: rotate(-10deg) scale(1); }
  20%  { transform: rotate(-9.2deg) scale(1.004); }
  40%  { transform: rotate(-7.8deg) scale(1.008); }
  60%  { transform: rotate(-8.9deg) scale(1.002); }
  80%  { transform: rotate(-10.8deg) scale(.998); }
  100% { transform: rotate(-12deg) scale(.995); }
}

<script>
  const ambienceAudio = document.getElementById('ambienceAudio');

  const DAY_TRACK = 'bird-song.mp3';
  const NIGHT_TRACK = 'night.mp3';

  // Set the volume for each track
  const DAY_VOLUME = 0.5;
  const NIGHT_VOLUME = 1;

  let currentTrack = DAY_TRACK;

  // Set initial volume
  ambienceAudio.volume = DAY_VOLUME;

  function toggleAudio() {
    if (ambienceAudio.paused) {
      ambienceAudio.play().catch(error => {
        console.error("Audio playback failed or was blocked by browser:", error);
      });
    } else {
      ambienceAudio.pause();
    }
  }

  function updateAmbienceTrack(phase) {
    const wanted = (phase === 'night') ? NIGHT_TRACK : DAY_TRACK;

    if (wanted !== currentTrack) {
      currentTrack = wanted;
      const wasPlaying = !ambienceAudio.paused;

      ambienceAudio.src = wanted;

      // Set the correct volume for the current track
      ambienceAudio.volume = (wanted === NIGHT_TRACK) ? NIGHT_VOLUME : DAY_VOLUME;

      if (wasPlaying) {
        ambienceAudio.play().catch(error => {
          console.error("Track switch error:", error);
        });
      }
    }
  }
  
  
</script>

      <blockquote class="biblical-quote" id="saying-quote">I am the one who bears witness about myself, and the Father who sent me bears witness about me.”</blockquote>

  <script>
    // ---------- Dictionary Data ----------
    const bibleDictionary = [
      {
        verse: "Deuteronomy 6:5",
        quote: "You shall love the LORD your God with all your heart and with all your soul and with all your might."
      },
      {
        verse: "John 7:29",
        quote: "I know him, for I come from him, and he sent me."
      },
      {
        verse: "John 5:39-40",
        quote: "You make search in the holy Writings, in the belief that through them you get eternal life; and it is those Writings which give witness about me. And still you have no desire to come to me so that you may have life."
      },
      {
      verse: "John 8:47",
        quote: "Whoever is of God hears the words of God. The reason why you do not hear them is that you are not of God."
      },
      {
      verse: "Deuteronomy 30:13-14",
        quote: "Neither is it beyond the sea, that you should say, ‘Who will go over the sea for us and bring it to us, that we may hear it and do it?’ And they are not across the sea, for you to say, Who will go over the sea for us and give us news of them so that we may do them? But the word is very near you. It is in your mouth and in your heart, so that you can do it."
      },
      {
        verse: "John 7:19-20",
        quote: "Has not Moses given you the law? Yet none of you keeps the law. Why do you seek to kill me? The crowd answered, “You have a demon! Who is seeking to kill you?”"
      },
    ];

    let currentSayingIndex = 0;

    function renderSaying(index) {
      const item = bibleDictionary[index];
      document.getElementById('saying-verse').textContent = item.verse;
      document.getElementById('saying-quote').textContent = `"${item.quote}"`;
      document.getElementById('saying-interpretation').textContent = item.interpretation;
    }

    function nextSaying() {
      currentSayingIndex = (currentSayingIndex + 1) % bibleDictionary.length;
      renderSaying(currentSayingIndex);
    }

    function toggleDrawer(show) {
      const drawer = document.getElementById('dictionaryDrawer');
      drawer.classList.toggle('is-closed', !show);
    }

    // ---------- elements ----------
    const skyEl = document.getElementById('sky');
    const starsField = document.getElementById('stars');
    const horizonEl = document.getElementById('horizonGlow');
    const sunEl = document.getElementById('sunEl');
    const moonEl = document.getElementById('moonEl');
    const moonShadowEl = document.getElementById('moonShadow');
    const hourLabelEl = document.getElementById('hourLabel');
    const hourGlossEl = document.getElementById('hourGloss');

    // ---------- generate stars ----------
    const starCount = 70;
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 60 + '%';
      star.style.animationDelay = (Math.random() * 3) + 's';
      star.style.animationDuration = (2 + Math.random() * 2) + 's';
      const size = Math.random() < 0.15 ? 3 : (Math.random() < 0.4 ? 2 : 1);
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.background = Math.random() < 0.3 ? '#f5e6c8' : '#ffffff';
      starsField.appendChild(star);
    }

    // ---------- moon phase (waxing/waning shadow) ----------
    function moonPhaseFraction(date) {
      const synodicMonth = 29.530588853;
      const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
      const diffDays = (date.getTime() - knownNewMoon) / 86400000;
      let phase = (diffDays % synodicMonth) / synodicMonth;
      if (phase < 0) phase += 1;
      return phase;
    }
    function updateMoonPhase() {
      const phase = moonPhaseFraction(new Date());
      const theta = phase * 2 * Math.PI;
      const rect = moonEl.getBoundingClientRect();
      const r = (rect.width || 40) / 2;
      const k = 1 - Math.cos(theta);
      const magnitude = r * k;
      const sign = theta <= Math.PI ? -1 : 1;
      moonShadowEl.style.transform = `translateX(${sign * magnitude}px)`;
    }

    // ---------- sky color keyframes (minute-of-day -> RGB) ----------
    const KEYFRAMES = [
      { t: 0,    top:[6,9,26],    mid:[10,14,36],  bot:[4,6,15]   },
      { t: 270,  top:[6,9,26],    mid:[16,20,45],  bot:[30,22,40] },
      { t: 330,  top:[40,35,85],  mid:[130,85,120],bot:[235,145,120] },
      { t: 390,  top:[95,130,190],mid:[235,155,110],bot:[255,195,130] },
      { t: 480,  top:[75,155,218],mid:[150,205,235],bot:[205,232,246] },
      { t: 720,  top:[60,150,222],mid:[150,207,236],bot:[210,236,249] },
      { t: 1050, top:[80,140,195],mid:[205,175,145],bot:[250,205,155] },
      { t: 1140, top:[70,90,150], mid:[230,130,90], bot:[255,150,90] },
      { t: 1185, top:[48,42,92],  mid:[180,82,92],  bot:[255,132,80] },
      { t: 1230, top:[16,16,46],  mid:[42,32,72],   bot:[68,42,72] },
      { t: 1290, top:[6,9,26],    mid:[10,14,36],   bot:[4,6,15] },
      { t: 1440, top:[6,9,26],    mid:[10,14,36],   bot:[4,6,15] }
    ];
    const lerp = (a,b,f) => a + (b-a)*f;
    const lerpColor = (c1,c2,f) => [0,1,2].map(i => Math.round(lerp(c1[i],c2[i],f)));
    function getSkyColors(minutes) {
      for (let i = 0; i < KEYFRAMES.length - 1; i++) {
        const k1 = KEYFRAMES[i], k2 = KEYFRAMES[i+1];
        if (minutes >= k1.t && minutes <= k2.t) {
          const f = (minutes - k1.t) / (k2.t - k1.t);
          return { top: lerpColor(k1.top,k2.top,f), mid: lerpColor(k1.mid,k2.mid,f), bot: lerpColor(k1.bot,k2.bot,f) };
        }
      }
      return { top: KEYFRAMES[0].top, mid: KEYFRAMES[0].mid, bot: KEYFRAMES[0].bot };
    }

    const clamp = x => Math.max(0, Math.min(1, x));

    // ---------- room light: how the sky's colour spills through the window ----------
    const luminance = c => (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255;
    const rgbaStr = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;

    // Frame stone: blends its night/day grey anchors by intensity, then
    // takes a light tint from the sky itself so it never looks neutral.
    const FRAME_TOP_NIGHT = [26,27,30],  FRAME_TOP_DAY = [123,128,133];
    const FRAME_MID_NIGHT = [48,45,44],  FRAME_MID_DAY = [94,99,104];
    const FRAME_BOT_NIGHT = [56,52,48],  FRAME_BOT_DAY = [68,72,76];

    // Floor ledge: same night/day-anchor + sky-tint approach as the frame.
    // The old formula blended a fixed stone-grey at ~75% weight regardless
    // of time of day, so the floor barely moved — this is why swapping in
    // a literal "red" was the only way to prove the rule was even live.
    // Anchored dark at night (then warmed by candleFactor below) and pale
    // stone by day, so it now visibly tracks the sky and walls.
    const LEDGE_TOP_NIGHT = [20,20,22],  LEDGE_TOP_DAY = [150,148,140];
    const LEDGE_BOT_NIGHT = [6,6,7],     LEDGE_BOT_DAY = [90,86,78];


    // Leaded tracery: the metal's mid/dark bands lighten with the sky,
    // and its highlight shifts from candle-gold at night to sky-white by day.
    const LEAD_BASE_NIGHT  = [53,55,58],  LEAD_BASE_DAY  = [138,141,144];
    const LEAD_DARK1_NIGHT = [32,34,36],  LEAD_DARK1_DAY = [90,93,96];
    const LEAD_DARK2_NIGHT = [8,9,11],    LEAD_DARK2_DAY = [58,60,62];
    const LEAD_HL_NIGHT    = [166,124,74], LEAD_HL_DAY   = [217,220,224];

    // Boosts a dark colour's brightness (preserving its hue) so it still reads
    // as a colour, not just "dark grey", when used to tint brighter surfaces.
    function normalizeLuminance(c, minLum) {
      const l = luminance(c);
      if (l <= 0 || l >= minLum) return c;
      const scale = minLum / l;
      return c.map(v => Math.min(255, v * scale));
    }

    // The candle's own warm colour — a dim burnt-orange ember tone, not a
    // bright flame — used to push the arch stone orange as candlelight
    // becomes the dominant light source.
    const CANDLE_WARM = [95, 55, 35];

    function updateRoomLight(sky, glow, phase) {
      // The window sits low relative to the room, so the horizon band (bot)
      // dominates what actually washes across the walls; mid contributes the
      // cooler overhead skylight.
      const roomBase = lerpColor(sky.mid, sky.bot, 0.65);
      const intensity = clamp(luminance(roomBase) * 1.05);
      // Used specifically for tinting the frame/tracery: at night roomBase is
      // near-black, so blending it in at low weight barely shifts hue away
      // from grey. Brightening it (hue preserved) keeps the frame reading as
      // "night blue" instead of plain grey, matching how it tints at other
      // times of day when roomBase is naturally brighter.
      const roomTint = normalizeLuminance(roomBase, 0.26);

      // Driven off the same continuous `intensity` value as everything else
      // (not the discrete day/dusk/night class), so it ramps in smoothly as
      // the sky darkens instead of snapping at a phase boundary. Curved so
      // it stays low through most of the day and rises quickly once the sky
      // actually starts to dim.
      const candleFactor = clamp(Math.pow(1 - intensity, 1.8));
      // As candlelight takes over, the sky's own colour should stop
      // fighting it for the frame's hue — fade the sky-tint weight down as
      // candle weight fades up, instead of blending both at fixed strength.
      const skyTintWeight = 0.4 * (1 - candleFactor * 0.85);

      const glowAlpha = clamp(0.08 + intensity * 0.42 + glow * 0.15);
      const edgeAlpha = clamp(0.85 - intensity * 0.55);
      const washAlpha = clamp(0.10 + glow * 0.20 + intensity * 0.06);
      const frameGlowColor = lerpColor(roomBase, CANDLE_WARM, candleFactor * 0.7);
      const frameAlpha = clamp(0.05 + glow * 0.16 + intensity * 0.06 + candleFactor * 0.08);
      const brightness = (0.72 + intensity * 0.4).toFixed(3);

      // Directly tracks the sky, the same way the frame does: blend the
      // night/day stone anchors by the sky's own intensity, tint with the
      // sky's hue at dawn/dusk, then warm toward candlelight as the room's
      // own light source takes over at night.
      const ledgeTop = lerpColor(
        lerpColor(lerpColor(LEDGE_TOP_NIGHT, LEDGE_TOP_DAY, intensity), roomTint, skyTintWeight * 0.5),
        CANDLE_WARM, candleFactor * 0.35);
      const ledgeBot = lerpColor(
        lerpColor(lerpColor(LEDGE_BOT_NIGHT, LEDGE_BOT_DAY, intensity), roomTint, skyTintWeight * 0.3),
        CANDLE_WARM, candleFactor * 0.55);

      const frameTop = lerpColor(
        lerpColor(lerpColor(FRAME_TOP_NIGHT, FRAME_TOP_DAY, intensity), roomTint, skyTintWeight * 0.4),
        CANDLE_WARM, candleFactor * 0.12);
      const frameMid = lerpColor(
        lerpColor(lerpColor(FRAME_MID_NIGHT, FRAME_MID_DAY, intensity), roomTint, skyTintWeight * 0.7),
        CANDLE_WARM, candleFactor * 0.45);
      const frameBot = lerpColor(
        lerpColor(lerpColor(FRAME_BOT_NIGHT, FRAME_BOT_DAY, intensity), roomTint, skyTintWeight),
        CANDLE_WARM, candleFactor * 0.8);

      const frameHighlightColor = lerpColor(lerpColor([255,255,255], roomTint, 0.35 * (1 - candleFactor * 0.6)), CANDLE_WARM, candleFactor * 0.4);
      const frameHighlightAlpha = 0.08 + intensity * 0.08;
      const frameInsetAlpha = 0.45 - intensity * 0.10;
      const frameOuterAlpha = 0.55 - intensity * 0.10;

      const leadBase  = lerpColor(lerpColor(LEAD_BASE_NIGHT, LEAD_BASE_DAY, intensity), roomBase, 0.10);
      const leadDark1 = lerpColor(LEAD_DARK1_NIGHT, LEAD_DARK1_DAY, intensity);
      const leadDark2 = lerpColor(LEAD_DARK2_NIGHT, LEAD_DARK2_DAY, intensity);
      const leadHighlight = lerpColor(lerpColor(lerpColor(LEAD_HL_NIGHT, LEAD_HL_DAY, intensity), roomTint, glow * 0.4), CANDLE_WARM, candleFactor * 0.3);

      const body = document.body.style;
      body.setProperty('--room-light', `rgb(${roomBase.join(',')})`);
      body.setProperty('--room-glow', rgbaStr(roomBase, glowAlpha));
      body.setProperty('--room-edge', `rgba(0,0,0,${edgeAlpha.toFixed(3)})`);
      body.setProperty('--room-wash', rgbaStr(roomBase, washAlpha));
      body.setProperty('--room-brightness', brightness);
      body.setProperty('--frame-glow', rgbaStr(frameGlowColor, frameAlpha));
      body.setProperty('--ledge-top', `rgb(${ledgeTop.join(',')})`);
      body.setProperty('--ledge-bot', `rgb(${ledgeBot.join(',')})`);
      body.setProperty('--frame-top', `rgb(${frameTop.join(',')})`);
      body.setProperty('--frame-mid', `rgb(${frameMid.join(',')})`);
      body.setProperty('--frame-bot', `rgb(${frameBot.join(',')})`);
      body.setProperty('--frame-highlight', rgbaStr(frameHighlightColor, frameHighlightAlpha));
      body.setProperty('--frame-inset-shadow', `rgba(0,0,0,${frameInsetAlpha.toFixed(3)})`);
      body.setProperty('--frame-outer-shadow', `rgba(0,0,0,${frameOuterAlpha.toFixed(3)})`);
      body.setProperty('--lead-base', `rgb(${leadBase.join(',')})`);
      body.setProperty('--lead-dark1', `rgb(${leadDark1.join(',')})`);
      body.setProperty('--lead-dark2', `rgb(${leadDark2.join(',')})`);
      body.setProperty('--lead-highlight', `rgb(${leadHighlight.join(',')})`);
    }

    const SUNRISE_START = 300, SUNRISE_FULL = 420, SUNSET_START = 1140, SUNSET_FULL = 1260;
    function sunOpacity(m) {
      if (m < SUNRISE_START) return 0;
      if (m < SUNRISE_FULL) return clamp((m - SUNRISE_START) / (SUNRISE_FULL - SUNRISE_START));
      if (m < SUNSET_START) return 1;
      if (m < SUNSET_FULL) return clamp(1 - (m - SUNSET_START) / (SUNSET_FULL - SUNSET_START));
      return 0;
    }

    const MOONRISE_START = 1170, MOONRISE_FULL = 1290, MOONSET_START = 240, MOONSET_FULL = 330;
    function moonOpacity(m) {
      if (m >= MOONRISE_START) return m < MOONRISE_FULL ? clamp((m - MOONRISE_START) / (MOONRISE_FULL - MOONRISE_START)) : 1;
      if (m < MOONSET_START) return 1;
      if (m < MOONSET_FULL) return clamp(1 - (m - MOONSET_START) / (MOONSET_FULL - MOONSET_START));
      return 0;
    }

    const STAR_IN_START = 1200, STAR_IN_FULL = 1290, STAR_OUT_START = 270, STAR_OUT_FULL = 360;
    function starOpacity(m) {
      if (m >= STAR_IN_START) return m < STAR_IN_FULL ? clamp((m - STAR_IN_START) / (STAR_IN_START)) : 1;
      if (m < STAR_OUT_START) return 1;
      if (m < STAR_OUT_FULL) return clamp(1 - (m - STAR_OUT_START) / (STAR_OUT_FULL - STAR_OUT_START));
      return 0;
    }

    function triangle(m, start, peak, end) {
      if (m <= start || m >= end) return 0;
      if (m <= peak) return (m - start) / (peak - start);
      return (end - m) / (end - peak);
    }
    function horizonGlowAmount(m) {
      return Math.max(triangle(m, 270, 360, 450), triangle(m, 1080, 1185, 1290));
    }

    function arcXY(f) {
      const x = 8 + f * 84;
      const y = 66 - Math.sin(Math.PI * f) * 50;
      return { x, y };
    }
    function fractionFor(m, start, end) { return clamp((m - start) / (end - start)); }

    function timeOfDayPhase(m) {
      // Mirrors the SUNRISE_/SUNSET_ thresholds above, so this stays in sync
      // with the sun/star fades automatically.
      if (m >= SUNRISE_START && m < SUNRISE_FULL) return 'dawn';
      if (m >= SUNRISE_FULL && m < SUNSET_START)  return 'day';
      if (m >= SUNSET_START && m < SUNSET_FULL)   return 'dusk';
      return 'night';
    }

    const TIME_OF_DAY_CLASSES = ['is-dawn', 'is-day', 'is-dusk', 'is-night'];
    function setTimeOfDayClass(phase) {
      const targetClass = 'is-' + phase;
      TIME_OF_DAY_CLASSES.forEach(cls => {
        document.body.classList.toggle(cls, cls === targetClass);
      });
      updateAmbienceTrack(phase);
    }

    function canonicalHour(hh) {
      if (hh < 3)  return { name: 'Matins',   gloss: 'The Night Watch' };
      if (hh < 6)  return { name: 'Lauds',    gloss: 'Praise at Daybreak' };
      if (hh < 9)  return { name: 'Prime',    gloss: 'The First Hour' };
      if (hh < 12) return { name: 'Terce',    gloss: 'Mid-Morning Prayer' };
      if (hh < 14) return { name: 'Sext',     gloss: 'Midday Prayer' };
      if (hh < 17) return { name: 'None',     gloss: 'Mid-Afternoon Prayer' };
      if (hh < 20) return { name: 'Vespers',  gloss: 'Evening Prayer' };
      return { name: 'Compline', gloss: 'Night Prayer' };
    }

    let debugMinutesOverride = null;

    function getLondonMinutes() {
      if (debugMinutesOverride !== null) {
        const hh = Math.floor(debugMinutesOverride / 60);
        const mm = debugMinutesOverride % 60;
        return { hh, mm, minutes: debugMinutesOverride };
      }
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(new Date());
      const hh = parseInt(parts.find(p => p.type === 'hour').value, 10);
      const mm = parseInt(parts.find(p => p.type === 'minute').value, 10);
      return { hh, mm, minutes: hh * 60 + mm };
    }

    function updateScene() {
      const { hh, minutes } = getLondonMinutes();

      const sky = getSkyColors(minutes);
      skyEl.style.setProperty('--c-top', `rgb(${sky.top.join(',')})`);
      skyEl.style.setProperty('--c-mid', `rgb(${sky.mid.join(',')})`);
      skyEl.style.setProperty('--c-bot', `rgb(${sky.bot.join(',')})`);

      const sOp = sunOpacity(minutes);
      const mOp = moonOpacity(minutes);
      const starOp = starOpacity(minutes);
      const glow = horizonGlowAmount(minutes);
      const phase = timeOfDayPhase(minutes);
      updateRoomLight(sky, glow, phase);

      sunEl.style.opacity = sOp;
      moonEl.style.opacity = mOp;
      starsField.style.opacity = starOp;
      horizonEl.style.opacity = glow;

      const sf = fractionFor(minutes, 270, 1290);
      const sPos = arcXY(sf);
      sunEl.style.left = sPos.x + '%';
      sunEl.style.top = sPos.y + '%';

      const mm2 = minutes < 600 ? minutes + 1440 : minutes;
      const mf = fractionFor(mm2, 1170, 1770);
      const mPos = arcXY(mf);
      moonEl.style.left = mPos.x + '%';
      moonEl.style.top = mPos.y + '%';

      const hour = canonicalHour(hh);
      hourLabelEl.textContent = hour.name;
      hourGlossEl.textContent = hour.gloss;

      setTimeOfDayClass(timeOfDayPhase(minutes));
    }

    function setDebugPhase(hh, mm) {
      debugMinutesOverride = hh * 60 + mm;
      updateScene();
    }
    function clearDebugPhase() {
      debugMinutesOverride = null;
      updateScene();
    }
    window.setDebugPhase = setDebugPhase;
    window.clearDebugPhase = clearDebugPhase;

    const timeParam = new URLSearchParams(window.location.search).get('time');
    if (timeParam && /^\d{1,2}:\d{2}$/.test(timeParam)) {
      const [oh, om] = timeParam.split(':').map(Number);
      if (oh >= 0 && oh < 24 && om >= 0 && om < 60) debugMinutesOverride = oh * 60 + om;
    }

    updateMoonPhase();
    updateScene();
    setInterval(updateScene, 15000);
    setInterval(updateMoonPhase, 60 * 60 * 1000);
    
    
    const moth = document.querySelector(".moth-wrap");

moth.addEventListener("animationiteration", () => {
    const front = moth.querySelector(".moth-wing-front");
    const back  = moth.querySelector(".moth-wing-back");

    front.style.animation = "mothFly .18s ease-in-out infinite";
    back.style.animation  = "mothFly .18s ease-in-out infinite reverse";

    setTimeout(() => {
        front.style.animation = "mothRest 8s linear infinite";
        back.style.animation  = "mothRest 8s linear infinite";
    }, 32000); // begins resting after it lands
});
  </script>
