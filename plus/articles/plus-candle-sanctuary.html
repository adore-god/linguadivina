  /* ---------- stone wall backdrop ---------- */
  .backdrop {
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(255, 255, 255, 0.15) 0%,
      rgba(255, 255, 255, 0.06) 35%,
      transparent 70%
    ),
    linear-gradient(
      180deg,
      #5d6064 0%,
      #474a4e 55%,
      #313438 100%
    );
  filter: brightness(var(--room-brightness));
}

/* Night version lives on its own layer that fades in via opacity.
   (Two different gradient values can't be smoothly cross-faded by
   transitioning "background" directly — that property change is
   discrete, so the browser snaps to the new gradient partway through
   the transition instead of blending, which read as a flashed-in
   grey patch whenever the day/night class toggled.) */
.backdrop::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: 0;
  pointer-events: none;
  transition: opacity 6s ease;
  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(255, 255, 255, 0.04) 0%,
      rgba(255, 255, 255, 0.015) 30%,
      transparent 65%
    ),
    linear-gradient(
      180deg,
      #1b1d20 0%,
      #111316 55%,
      #07080a 100%
    );
}

body.is-night .backdrop::after {
  opacity: 1;
}

.backdrop::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  background: var(--room-wash);
  mix-blend-mode: soft-light;
  pointer-events: none;
}

  /* ---------- wall cracks ---------- */
  .wall-cracks {
    position: absolute;

    z-index: 1;
    pointer-events: none;
    opacity: 0.2; 
    transition: opacity 4s ease;
  }
  .wall-cracks svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .crack {
    fill: none;
    stroke: rgba(0,0,0,0.75);
    stroke-width: 0.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .crack-highlight {
    fill: none;
    stroke: rgba(255,255,255,0.2);
    stroke-width: 0.14;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  body.is-night .wall-cracks { opacity: 0.25; }

.candlelight-ambient {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  mix-blend-mode: screen;

  opacity: 0.18;
  transition: opacity 3s ease;

  background:
    radial-gradient(
      ellipse at 50% 90%,
      rgba(255,150,70,0.55) 0%,
      rgba(255,120,40,0.16) 32%,
      transparent 65%
    );

  transform-origin: 50% 100%;
  animation: candleSway 6s ease-in-out infinite,
             candleFlicker 2.4s ease-in-out infinite alternate;
}

body.is-night {
  background: #08090b;
}

body.is-night .candlelight-ambient {
  opacity: 0.72;
}

@keyframes candleSway {
  0% {
    transform: translateX(-4px) rotate(-0.5deg) scale(1);
  }
  25% {
    transform: translateX(2px) rotate(0.3deg) scale(1.02);
  }
  50% {
    transform: translateX(5px) rotate(0.6deg) scale(0.99);
  }
  75% {
    transform: translateX(-2px) rotate(-0.3deg) scale(1.01);
  }
  100% {
    transform: translateX(-4px) rotate(-0.5deg) scale(1);
  }
}

@keyframes candleFlicker {
  0% {
    opacity: 0.68;
    filter: blur(0px);
  }
  30% {
    opacity: 0.74;
  }
  60% {
    opacity: 0.66;
    filter: blur(1px);
  }
  100% {
    opacity: 0.72;
    filter: blur(0px);
  }
}


.candlelight-ambient::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity:0;
  background:
    radial-gradient(
      ellipse at var(--x,50%) var(--y,90%),
      rgba(255,155,75,.55) 0%,
      rgba(255,120,40,.16) 32%,

    );

}

@keyframes flame {
  0% {
    --x: 49%;
    --y: 91%;
    transform: scale(1);
  }
  20% {
    --x: 50.5%;
    --y: 89%;
    transform: scale(1.02);
  }
  40% {
    --x: 48.8%;
    --y: 90%;
    transform: scale(0.99);
  }
  60% {

  }
  80% {

    --y: 90.5%;

  }
  100% {

    --y: 91%;

  }
}

  /* ---------- Closeable Floating Drawer (Dictionary) ---------- */
  /* Colours below are drawn from the same custom properties the window
     frame, lead came, and robin already use — set once per minute in JS
     from the sky's state, and inherited down through body. That's what
     lets this panel shift through the same dawn/day/dusk/night + candle
     warmth as the rest of the room, with no extra JS needed here. */
  .dictionary-drawer {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 20;

    /* Center horizontal offset and set pivot at bottom */
    transform: translateX(-50%); 
    transform-origin: bottom center;
    
    /* Smooth flicker animation with natural swaying */
    animation: organicFlicker 2.3s ease-in-out 0.1s infinite;
}

.flame-core {
    position: absolute;
    inset: 0;
    
    /* Exact original color gradient */
    background: radial-gradient(
      ellipse at 50% 70%,
      #ffffff 0%,
      #fffdf5 25%,
      #ffe7a8 55%,
      #ffb347 80%,
      rgba(255,179,71,0) 100%
    );
    
    /* Smooth teardrop flame shape (replaces polygon clip-path) */
    border-radius: 50% 50% 35% 35% / 80% 80% 35% 35%;
    
    /* Outer light bleed and soft glow */
    filter: drop-shadow(0 -4px 10px rgba(255, 179, 71, 0.65)) blur(0.3px);
}

/* BLUE CORE: Keeps the flame base defined so it doesn't melt into the candle surface */
.flame::after {
    content: "";
    position: absolute;
    bottom: 1px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 6px;
    background: radial-gradient(ellipse at 50% 80%, rgba(60, 130, 255, 0.85) 0%, rgba(40, 80, 220, 0) 100%);
    border-radius: 50% 50% 40% 40%;
    pointer-events: none;
}

/* Dynamic flicker keyframes */
@keyframes organicFlicker {
    0%, 100% {
        transform: translateX(-50%) scale(1) rotate(0deg);
        opacity: 0.95;
    }
    22% {
        transform: translateX(-50%) scale(1.05, 0.95) rotate(-1.5deg);
        opacity: 1;
    }
    45% {
        transform: translateX(-50%) scale(0.96, 1.04) rotate(2deg);
        opacity: 0.9;
    }
    68% {
        transform: translateX(-50%) scale(1.03, 0.97) rotate(-1deg);
        opacity: 1;
    }
    85% {
        transform: translateX(-50%) scale(0.98, 1.02) rotate(1deg);
        opacity: 0.93;
    }
}

/* BLUE CORE: Prevents flame from melting into the candle surface */

@keyframes organicFlicker {
    0%, 100% {
        transform: translateX(-50%) scale(1) rotate(0deg);
        opacity: 0.95;
    }
    22% {
        transform: translateX(-50%) scale(1.06, 0.94) rotate(-1.5deg);

    }
    45% {
        transform: translateX(-50%) scale(0.95, 1.05) rotate(2deg);

    }

        transform: translateX(-50%) scale(0.98, 1.02) rotate(1deg);
        opacity: 0.93;
    }
}

/* Flicker variants: same family as organicFlicker but with different peak
   timings, sway amounts and rotation so each flame reads as its own small
   fire rather than a copy shifted only by delay. */
@keyframes organicFlicker2 {
    0%, 100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 0.93; }
    18%      { transform: translateX(-50%) scale(1.08, 0.92) rotate(2deg); opacity: 1; }
    38%      { transform: translateX(-50%) scale(0.94, 1.07) rotate(-2.5deg); opacity: 0.87; }
    60%      { transform: translateX(-50%) scale(1.04, 0.96) rotate(1.5deg); opacity: 1; }
    82%      { transform: translateX(-50%) scale(0.97, 1.03) rotate(-1deg); opacity: 0.9; }
}
@keyframes organicFlicker3 {
    0%, 100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 0.96; }
    15%      { transform: translateX(-50%) scale(0.94, 1.06) rotate(-2deg); opacity: 0.9; }
    35%      { transform: translateX(-50%) scale(1.07, 0.93) rotate(2.5deg); opacity: 1; }
    55%      { transform: translateX(-50%) scale(0.98, 1.02) rotate(-1.5deg); opacity: 0.88; }
    78%      { transform: translateX(-50%) scale(1.03, 0.97) rotate(1deg); opacity: 1; }
}
@keyframes organicFlicker4 {
    0%, 100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 0.9; }
    25%      { transform: translateX(-50%) scale(1.02, 0.98) rotate(-1deg); opacity: 1; }
    50%      { transform: translateX(-50%) scale(0.92, 1.09) rotate(2deg); opacity: 0.84; }
    72%      { transform: translateX(-50%) scale(1.06, 0.94) rotate(-2deg); opacity: 1; }
    90%      { transform: translateX(-50%) scale(0.99, 1.01) rotate(0.5deg); opacity: 0.93; }
}

  /* ---------- dove (Genesis 8:11 — sent from the ark, returning with an olive leaf) ---------- */
  .dove-wrap {
    position: absolute;
    z-index:3;
    width: 20%; 
    aspect-ratio: 2.2 / 1;
    left: -22%;
    top: 65%;

    animation-delay: 20s;
}

.dove-wrap svg { 
    width: 100%; 
    height: 100%; 
    display: block; 
    overflow: visible; 
}

/* Base Wing & Body Properties */
.dove-wing {
    transform-box: fill-box;
    will-change: transform;
}

/* Default Fallback (Prevents disappearing if time class is missing/failing) */
.dove-body, .dove-tail      { fill: rgba(140, 135, 130, 0.9); }
.dove-wing-front            { fill: rgba(150, 145, 140, 0.9); }
.dove-wing-back             { fill: rgba(110, 105, 100, 0.85); }
.dove-beak                  { fill: rgba(160, 130, 80, 0.9); }
.dove-twig-leaf             { fill: rgba(56, 125, 80, 0.85); }
.dove-twig-stem             { stroke: rgba(40, 95, 60, 0.80); stroke-width: 1.2; fill: none; }

.dove-body, 
.dove-tail, 
.dove-wing, 
.dove-beak,
.dove-twig-leaf,
.dove-twig-stem {
    transition: fill 3s ease-in-out, stroke 3s ease-in-out;
}

/* Wing Movements */
.dove-wing-front {
    transform-origin: 42px 27px; 
    animation: doveWingFlapFront 0.7s cubic-bezier(0.42, 0, 0.58, 1) infinite;
}

.dove-wing-back {
    transform-origin: 42px 27px; 
    animation: doveWingFlapBack 0.7s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    animation-delay: -0.09s;
}

@keyframes doveWingFlapFront {
    0%   { transform: rotate(-24deg) scaleY(0.9) skewX(-4deg); }
    35%  { transform: rotate(20deg) scaleY(1.05) skewX(5deg); }
    55%  { transform: rotate(24deg) scaleY(0.85) skewX(8deg); }
    85%  { transform: rotate(-12deg) scaleY(0.65) skewX(-2deg); }
    100% { transform: rotate(-24deg) scaleY(0.9) skewX(-4deg); }
}

@keyframes doveWingFlapBack {
    0%   { transform: translate(1px, -1px) rotate(-22deg) scaleY(0.88) skewX(-4deg); }
    35%  { transform: translate(0px, 0px) rotate(18deg) scaleY(1.02) skewX(5deg); }
    55%  { transform: translate(0px, 0px) rotate(22deg) scaleY(0.85) skewX(8deg); }
    85%  { transform: translate(1px, -1px) rotate(-10deg) scaleY(0.65) skewX(-2deg); }
    100% { transform: translate(1px, -1px) rotate(-22deg) scaleY(0.88) skewX(-4deg); }
}

/* ===================================================
   TIME OF DAY COLOR ADAPTATIONS
   =================================================== */

/* 1. MORNING / DAWN */
body.is-dawn .dove-body,
body.is-dawn .dove-tail      { fill: rgba(185, 150, 140, 0.9); }
body.is-dawn .dove-wing-front { fill: rgba(200, 165, 150, 0.9); }
body.is-dawn .dove-wing-back  { fill: rgba(150, 120, 115, 0.85); }
body.is-dawn .dove-beak       { fill: rgba(210, 140, 90, 0.95); }
body.is-dawn .dove-twig-leaf  { fill: rgba(100, 150, 90, 0.9); }
body.is-dawn .dove-twig-stem  { stroke: rgba(80, 110, 60, 0.85); }

/* 2. DAY (Solid opaque muted colors — mix-blend-mode removed to prevent disappearing) */
body.is-day .dove-body,
body.is-day .dove-tail       { fill: rgba(165, 160, 155, 0.95); }
body.is-day .dove-wing-front { fill: rgba(180, 175, 170, 0.95); }
body.is-day .dove-wing-back  { fill: rgba(135, 130, 125, 0.9); }
body.is-day .dove-beak       { fill: rgba(175, 145, 95, 0.95); }
body.is-day .dove-twig-leaf  { fill: rgba(56, 125, 80, 0.9); }
body.is-day .dove-twig-stem  { stroke: rgba(40, 95, 60, 0.85); }

<script>
  const ambienceAudio = document.getElementById('ambienceAudio');

  const DAY_TRACK = 'bird-song.mp3';
  const NIGHT_TRACK = 'night.mp3';

  // Set the volume for each track
  const DAY_VOLUME = 0.5;
  const NIGHT_VOLUME = 1;

  let currentTrack = DAY_TRACK;

  // Set initial volume
  ambienceAudio.volume = DAY_VOLUME;

  function toggleAudio() {
    if (ambienceAudio.paused) {
      ambienceAudio.play().catch(error => {
        console.error("Audio playback failed or was blocked by browser:", error);
      });
    } else {
      ambienceAudio.pause();
    }
  }

  function updateAmbienceTrack(phase) {
    const wanted = (phase === 'night') ? NIGHT_TRACK : DAY_TRACK;

    if (wanted !== currentTrack) {
      currentTrack = wanted;
      const wasPlaying = !ambienceAudio.paused;

      ambienceAudio.src = wanted;

      // Set the correct volume for the current track
      ambienceAudio.volume = (wanted === NIGHT_TRACK) ? NIGHT_VOLUME : DAY_VOLUME;

      if (wasPlaying) {
        ambienceAudio.play().catch(error => {
          console.error("Track switch error:", error);
        });
      }
    }
  }
  
  
</script>

body.is-night .cross-ornament {
  fill: #2c1a10; /* Deep shadowed wood */
}

body.is-night .cross-ring {
  stroke: #1e110a;
}

body.is-night .cross-center {
  fill: #5c140a;
}

body.is-night .sea-cross-wrap{
    animation: crossCandleGlow 3.3s infinite ease-in-out; 
}

@keyframes crossCandleGlow{

    0%,100%{
        filter:
            drop-shadow(0 2px 8px rgba(0,0,0,.7))
            brightness(0.55);
    }

    18%{
        filter:
            drop-shadow(0 2px 8px rgba(0,0,0,.7))
            brightness(0.85);
    }

    43%{
        filter:
            drop-shadow(0 2px 8px rgba(0,0,0,.7))
            brightness(.76);
    }

    67%{
        filter:
            drop-shadow(0 2px 8px rgba(0,0,0,.7))
            brightness(1.10);
    }

    84%{
        filter:
            drop-shadow(0 2px 8px rgba(0,0,0,.7))
            brightness(1.02);
    }
}


body.is-night .vine-stem,
body.is-night .vine-tendril{
    animation: stemCandleLight 3.3s infinite ease-in-out;
}

@keyframes stemCandleLight{

    0%,100%{
        filter:brightness(1);
    }

    25%{
        filter:brightness(1.08);
    }

    55%{
        filter:brightness(.97);
    }

    78%{
        filter:brightness(1.05);
    }
}

body.is-night .flower-petal,
body.is-night .flower-petal-inner,
body.is-night .flower-center,
body.is-night .flower-bud{
    animation: flowerCandleLight 3.3s infinite ease-in-out;
}

@keyframes flowerCandleLight {

    /* Starts dark */
    0% {
        filter: brightness(.62);
    }

    8% {
        filter: brightness(.68);
    }

    16% {
        filter: brightness(.77);
    }

    24% {
        filter: brightness(.88);
    }

    34% {
        filter: brightness(.98);
    }

    /* Bright glint */
    40% {
        filter: brightness(1.04);
    }

    41% {
        filter: brightness(1.24);
    }

    42% {
        filter: brightness(1.02);
    }

    54% {
        filter: brightness(.94);
    }

    66% {
        filter: brightness(1.08);
    }

    76% {
        filter: brightness(.96);
    }

    /* Softer glint */
    84% {
        filter: brightness(1.02);
    }

    85% {
        filter: brightness(1.18);
    }

    86% {
        filter: brightness(1.00);
    }

    94% {
        filter: brightness(.89);
    }

    /* Ends dark so the loop is seamless */
    100% {
        filter: brightness(.62);
    }
}

body.is-night .vine-leaf-base,
body.is-night .vine-leaf-dark{
    animation: leafCandleLight 3.3s infinite ease-in-out;
}

@keyframes leafCandleLight{

    0%,100%{
        filter:brightness(1);
    }

    22%{
        filter:brightness(1.14);
    }

    48%{
        filter:brightness(.96);
    }

    70%{
        filter:brightness(1.10);
    }

    88%{
        filter:brightness(1.03);
    }
}



/* ==========================
   Clouds
   ========================== */

.clouds{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:3;
}

.cloud{
    position:absolute;
    height:90px;
    opacity: 1;

    background:
        radial-gradient(circle at 15% 60%, rgba(255,255,255,.28) 0 18%, transparent 19%),
        radial-gradient(circle at 30% 35%, rgba(255,255,255,.32) 0 23%, transparent 24%),
        radial-gradient(circle at 48% 58%, rgba(255,255,255,.30) 0 21%, transparent 22%),
        radial-gradient(circle at 66% 32%, rgba(255,255,255,.28) 0 24%, transparent 25%),
        radial-gradient(circle at 84% 55%, rgba(255,255,255,.26) 0 19%, transparent 20%);

    filter: blur(14px);
    background-repeat:no-repeat;
}

/* Cloud 1 */

.cloud1{
    width:280px;
    top:24%;
    left:-320px;
    animation:cloud1 160s linear infinite;
}

/* Cloud 2 */

.cloud2{
    width: 120px;
    top: 48%;
    left:-920px;
    
    animation:cloud2 400s linear infinite;
}

/* Cloud 3 */

.cloud3{
    width: 190px;
    top:65%;
    left:-2620px;
    
    animation:cloud3 300s linear infinite;
}

/* Animations */

@keyframes cloud1{
    from{ transform:translateX(0); }
    to{ transform:translateX(2200px); }
}

@keyframes cloud2{
    from{ transform:translateX(0); }
    to{ transform:translateX(2600px); }
}

@keyframes cloud3{
    from{ transform:translateX(0); }
    to{ transform:translateX(2400px); }
}

  <!-- Closeable Floating Neville Goddard Article -->
  <div class="dictionary-drawer" id="dictionaryDrawer">
    <div class="drawer-header">
      <span class="drawer-title" id="saying-verse">John 8:18</span>
      <button class="close-btn" onclick="toggleDrawer(false)" aria-label="Close">&times;</button>
    </div>
    <div class="drawer-content">
      <blockquote class="biblical-quote" id="saying-quote">I am the one who bears witness about myself, and the Father who sent me bears witness about me.”</blockquote>
      <div class="interpretation-text" id="saying-interpretation">

        <button class="drawer-btn" onclick="nextSaying()">Next Passage</button>

  </div>

  <script>
    // ---------- Dictionary Data ----------
    const bibleDictionary = [
      {
        verse: "Deuteronomy 6:5",
        quote: "You shall love the LORD your God with all your heart and with all your soul and with all your might."
      },
      {
        verse: "John 7:29",
        quote: "I know him, for I come from him, and he sent me."
      },
      {
        verse: "John 5:39-40",
        quote: "You make search in the holy Writings, in the belief that through them you get eternal life; and it is those Writings which give witness about me. And still you have no desire to come to me so that you may have life."
      },
      {
      verse: "John 8:47",
        quote: "Whoever is of God hears the words of God. The reason why you do not hear them is that you are not of God."
      },
      {
      verse: "Deuteronomy 30:13-14",
        quote: "Neither is it beyond the sea, that you should say, ‘Who will go over the sea for us and bring it to us, that we may hear it and do it?’ And they are not across the sea, for you to say, Who will go over the sea for us and give us news of them so that we may do them? But the word is very near you. It is in your mouth and in your heart, so that you can do it."
      },
      {
        verse: "John 7:19-20",
        quote: "Has not Moses given you the law? Yet none of you keeps the law. Why do you seek to kill me? The crowd answered, “You have a demon! Who is seeking to kill you?”"
      },
    ];

    let currentSayingIndex = 0;

    function renderSaying(index) {
      const item = bibleDictionary[index];
      document.getElementById('saying-verse').textContent = item.verse;
      document.getElementById('saying-quote').textContent = `"${item.quote}"`;
      document.getElementById('saying-interpretation').textContent = item.interpretation;
    }

    function nextSaying() {
      currentSayingIndex = (currentSayingIndex + 1) % bibleDictionary.length;
      renderSaying(currentSayingIndex);
    }

    function toggleDrawer(show) {
      const drawer = document.getElementById('dictionaryDrawer');
      drawer.classList.toggle('is-closed', !show);
    }

    // ---------- elements ----------
    const skyEl = document.getElementById('sky');
    const starsField = document.getElementById('stars');
    const horizonEl = document.getElementById('horizonGlow');
    const sunEl = document.getElementById('sunEl');
    const moonEl = document.getElementById('moonEl');
    const moonShadowEl = document.getElementById('moonShadow');
    const hourLabelEl = document.getElementById('hourLabel');
    const hourGlossEl = document.getElementById('hourGloss');

    // ---------- occasional visitors: butterfly & robin ----------
    // Each animation still plays at its original speed once triggered; only
    // how often it starts is now randomized and spaced further apart.
    function randomDelayMs(minMinutes, maxMinutes) {
      return (minMinutes + Math.random() * (maxMinutes - minMinutes)) * 60 * 1000;
    }

    const butterflyEl = document.getElementById('butterflyEl');
    if (butterflyEl) {
      const flyButterfly = () => {
        void butterflyEl.offsetWidth; // force reflow so the animation can restart
        butterflyEl.classList.add('is-flying');
      };
      butterflyEl.addEventListener('animationend', () => {
        butterflyEl.classList.remove('is-flying');
        setTimeout(flyButterfly, randomDelayMs(3, 7)); // next flight in ~3-7 min
      });
      setTimeout(flyButterfly, randomDelayMs(1, 2)); // first flight soon after load
    }

    const robinEl = document.getElementById('robinEl');
    if (robinEl) {
      const visitRobin = () => {
        void robinEl.offsetWidth; // force reflow so the animation can restart
        robinEl.classList.add('is-visiting');
      };
      robinEl.addEventListener('animationend', () => {
        robinEl.classList.remove('is-visiting');
        setTimeout(visitRobin, randomDelayMs(4, 8)); // next visit in ~4-8 min
      });
      setTimeout(visitRobin, randomDelayMs(1, 3)); // first visit soon after load
    }

    // ---------- generate stars ----------
    const starCount = 70;
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 60 + '%';
      star.style.animationDelay = (Math.random() * 3) + 's';
      star.style.animationDuration = (2 + Math.random() * 2) + 's';
      const size = Math.random() < 0.15 ? 3 : (Math.random() < 0.4 ? 2 : 1);
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.background = Math.random() < 0.3 ? '#f5e6c8' : '#ffffff';
      starsField.appendChild(star);
    }

    // ---------- moon phase (waxing/waning shadow) ----------
    function moonPhaseFraction(date) {
      const synodicMonth = 29.530588853;
      const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
      const diffDays = (date.getTime() - knownNewMoon) / 86400000;
      let phase = (diffDays % synodicMonth) / synodicMonth;
      if (phase < 0) phase += 1;
      return phase;
    }
    function updateMoonPhase() {
      const phase = moonPhaseFraction(new Date());
      const theta = phase * 2 * Math.PI;
      const rect = moonEl.getBoundingClientRect();
      const r = (rect.width || 40) / 2;
      const k = 1 - Math.cos(theta);
      const magnitude = r * k;
      const sign = theta <= Math.PI ? -1 : 1;
      moonShadowEl.style.transform = `translateX(${sign * magnitude}px)`;
    }

    // ---------- sky color keyframes (minute-of-day -> RGB) ----------
    const KEYFRAMES = [
  { t: 0,    top:[10,14,28],   mid:[16,22,42],   bot:[22,28,48]   },
  { t: 270,  top:[10,14,28],   mid:[16,22,42],   bot:[22,28,48]   },

  { t: 330,  top:[40,35,85],   mid:[130,85,120], bot:[235,145,120] },
  { t: 390,  top:[95,130,190], mid:[235,155,110],bot:[255,195,130] },

  { t: 480,  top:[75,155,218], mid:[150,205,235],bot:[205,232,246] },
  { t: 720,  top:[60,150,222], mid:[150,207,236],bot:[210,236,249] },

  { t: 1050, top:[80,140,195], mid:[205,175,145],bot:[250,205,155] },
  { t: 1140, top:[70,90,150],  mid:[230,130,90], bot:[255,150,90] },
  { t: 1185, top:[48,42,92],   mid:[180,82,92],  bot:[255,132,80] },

  { t: 1230, top:[10,14,28],   mid:[16,22,42],   bot:[22,28,48]   },
  { t: 1290, top:[10,14,28],   mid:[16,22,42],   bot:[22,28,48]   },
  { t: 1440, top:[10,14,28],   mid:[16,22,42],   bot:[22,28,48]   }
];
    const lerp = (a,b,f) => a + (b-a)*f;
    const lerpColor = (c1,c2,f) => [0,1,2].map(i => Math.round(lerp(c1[i],c2[i],f)));
    function getSkyColors(minutes) {
      for (let i = 0; i < KEYFRAMES.length - 1; i++) {
        const k1 = KEYFRAMES[i], k2 = KEYFRAMES[i+1];
        if (minutes >= k1.t && minutes <= k2.t) {
          const f = (minutes - k1.t) / (k2.t - k1.t);
          return { top: lerpColor(k1.top,k2.top,f), mid: lerpColor(k1.mid,k2.mid,f), bot: lerpColor(k1.bot,k2.bot,f) };
        }
      }
      return { top: KEYFRAMES[0].top, mid: KEYFRAMES[0].mid, bot: KEYFRAMES[0].bot };
    }

    const clamp = x => Math.max(0, Math.min(1, x));

    // ---------- room light: how the sky's colour spills through the window ----------
    const luminance = c => (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255;
    const rgbaStr = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;

    // Frame stone: blends its night/day grey anchors by intensity, then
    // takes a light tint from the sky itself so it never looks neutral.
    const FRAME_TOP_NIGHT = [26,27,30],  FRAME_TOP_DAY = [123,128,133];
    const FRAME_MID_NIGHT = [48,45,44],  FRAME_MID_DAY = [94,99,104];
    const FRAME_BOT_NIGHT = [56,52,48],  FRAME_BOT_DAY = [68,72,76];

    // Floor ledge: same night/day-anchor + sky-tint approach as the frame.
    // The old formula blended a fixed stone-grey at ~75% weight regardless
    // of time of day, so the floor barely moved — this is why swapping in
    // a literal "red" was the only way to prove the rule was even live.
    // Anchored dark at night (then warmed by candleFactor below) and pale
    // stone by day, so it now visibly tracks the sky and walls.
    const LEDGE_TOP_NIGHT = [20,20,22],  LEDGE_TOP_DAY = [150,148,140];
    const LEDGE_BOT_NIGHT = [6,6,7],     LEDGE_BOT_DAY = [90,86,78];


    // Leaded tracery: the metal's mid/dark bands lighten with the sky,
    // and its highlight shifts from candle-gold at night to sky-white by day.
    const LEAD_BASE_NIGHT  = [53,55,58],  LEAD_BASE_DAY  = [138,141,144];
    const LEAD_DARK1_NIGHT = [32,34,36],  LEAD_DARK1_DAY = [90,93,96];
    const LEAD_DARK2_NIGHT = [8,9,11],    LEAD_DARK2_DAY = [58,60,62];
    const LEAD_HL_NIGHT    = [166,124,74], LEAD_HL_DAY   = [217,220,224];

    // Robin plumage: night/day anchors like everything else above, plus a
    // warm "golden hour" kiss (weighted by the same horizon-glow value that
    // drives the arch's glow) since the bird sits in actual outdoor light,
    // not candlelight. Bird is hidden at night anyway, so the night anchors
    // just need to read as believable dusk/dawn shadow, not true darkness.
    const ROBIN_CROWN_NIGHT    = [46,42,38],  ROBIN_CROWN_DAY    = [110,99,84];
    const ROBIN_BACK_NIGHT     = [34,30,22],  ROBIN_BACK_DAY     = [107,92,64];
    const ROBIN_BREAST_NIGHT   = [92,44,30],  ROBIN_BREAST_DAY   = [226,108,58];
    const ROBIN_BREAST_DK_NIGHT= [62,28,20],  ROBIN_BREAST_DK_DAY= [176,80,42];
    const ROBIN_BIB_EDGE_NIGHT = [70,68,64],  ROBIN_BIB_EDGE_DAY = [196,196,186];
    const ROBIN_BELLY_NIGHT    = [58,54,46],  ROBIN_BELLY_DAY    = [238,231,214];
    const ROBIN_WING_NIGHT     = [26,23,17],  ROBIN_WING_DAY     = [70,58,42];
    const ROBIN_WINGCOV_NIGHT  = [36,32,24],  ROBIN_WINGCOV_DAY  = [96,82,58];
    const ROBIN_WINGEDGE_NIGHT = [54,48,36],  ROBIN_WINGEDGE_DAY = [150,130,92];
    const ROBIN_TAIL_NIGHT     = [28,25,19],  ROBIN_TAIL_DAY     = [90,74,54];
    const ROBIN_BEAK_NIGHT     = [14,12,10],  ROBIN_BEAK_DAY     = [40,32,26];
    const ROBIN_LEG_NIGHT      = [48,38,32],  ROBIN_LEG_DAY      = [162,124,100];
    const GOLDEN_LIGHT = [255,176,96];

    // Carved wooden figure: day anchors are a properly sunlit warm wood tone
    // (not the old flat/muted brown that read as "lightless" through the
    // day), night anchors stay dim and are then warmed toward the actual
    // candle colour by candleFactor, so the amber glow comes from the same
    // flame lighting everything else instead of a hardcoded night palette.
    const FIGURE_WOOD_TOP_NIGHT = [40,24,14],  FIGURE_WOOD_TOP_DAY = [176,132,86];
    const FIGURE_WOOD_MID_NIGHT = [26,16,9],   FIGURE_WOOD_MID_DAY = [132,94,60];
    const FIGURE_WOOD_BOT_NIGHT = [10,6,4],    FIGURE_WOOD_BOT_DAY = [80,58,38];
    const FIGURE_HEAD_BOT_NIGHT = [26,16,9],   FIGURE_HEAD_BOT_DAY = [132,94,60];
    const FIGURE_DETAIL_NIGHT   = [20,10,5],   FIGURE_DETAIL_DAY   = [51,34,23];
    const FIGURE_GROOVE_NIGHT   = [74,36,19],  FIGURE_GROOVE_DAY   = [51,34,23];

    // Boosts a dark colour's brightness (preserving its hue) so it still reads
    // as a colour, not just "dark grey", when used to tint brighter surfaces.
    function normalizeLuminance(c, minLum) {
      const l = luminance(c);
      if (l <= 0 || l >= minLum) return c;
      const scale = minLum / l;
      return c.map(v => Math.min(255, v * scale));
    }

    // The candle's own warm colour — a dim burnt-orange ember tone, not a
    // bright flame — used to push the arch stone orange as candlelight
    // becomes the dominant light source.
    const CANDLE_WARM = [95, 55, 35];

    function updateRoomLight(sky, glow, phase) {
      // The window sits low relative to the room, so the horizon band (bot)
      // dominates what actually washes across the walls; mid contributes the
      // cooler overhead skylight.
      const roomBase = lerpColor(sky.mid, sky.bot, 0.65);
      const intensity = clamp(luminance(roomBase) * 1.05);
      // Used specifically for tinting the frame/tracery: at night roomBase is
      // near-black, so blending it in at low weight barely shifts hue away
      // from grey. Brightening it (hue preserved) keeps the frame reading as
      // "night blue" instead of plain grey, matching how it tints at other
      // times of day when roomBase is naturally brighter.
      const roomTint = normalizeLuminance(roomBase, 0.26);

      // Driven off the same continuous `intensity` value as everything else
      // (not the discrete day/dusk/night class), so it ramps in smoothly as
      // the sky darkens instead of snapping at a phase boundary. Curved so
      // it stays low through most of the day and rises quickly once the sky
      // actually starts to dim.
      const candleFactor = clamp(Math.pow(1 - intensity, 1.8));
      // As candlelight takes over, the sky's own colour should stop
      // fighting it for the frame's hue — fade the sky-tint weight down as
      // candle weight fades up, instead of blending both at fixed strength.
      const skyTintWeight = 0.4 * (1 - candleFactor * 0.85);

      const glowAlpha = clamp(0.08 + intensity * 0.42 + glow * 0.15);
      const edgeAlpha = clamp(0.85 - intensity * 0.55);
      const washAlpha = clamp(0.10 + glow * 0.20 + intensity * 0.06);
      const frameGlowColor = lerpColor(roomBase, CANDLE_WARM, candleFactor * 0.7);
      const frameAlpha = clamp(0.05 + glow * 0.16 + intensity * 0.06 + candleFactor * 0.08);
      const brightness = (0.72 + intensity * 0.4).toFixed(3);

      // Directly tracks the sky, the same way the frame does: blend the
      // night/day stone anchors by the sky's own intensity, tint with the
      // sky's hue at dawn/dusk, then warm toward candlelight as the room's
      // own light source takes over at night.
      const ledgeTop = lerpColor(
        lerpColor(lerpColor(LEDGE_TOP_NIGHT, LEDGE_TOP_DAY, intensity), roomTint, skyTintWeight * 0.5),
        CANDLE_WARM, candleFactor * 0.35);
      const ledgeBot = lerpColor(
        lerpColor(lerpColor(LEDGE_BOT_NIGHT, LEDGE_BOT_DAY, intensity), roomTint, skyTintWeight * 0.3),
        CANDLE_WARM, candleFactor * 0.55);

      const frameTop = lerpColor(
        lerpColor(lerpColor(FRAME_TOP_NIGHT, FRAME_TOP_DAY, intensity), roomTint, skyTintWeight * 0.4),
        CANDLE_WARM, candleFactor * 0.12);
      const frameMid = lerpColor(
        lerpColor(lerpColor(FRAME_MID_NIGHT, FRAME_MID_DAY, intensity), roomTint, skyTintWeight * 0.7),
        CANDLE_WARM, candleFactor * 0.45);
      const frameBot = lerpColor(
        lerpColor(lerpColor(FRAME_BOT_NIGHT, FRAME_BOT_DAY, intensity), roomTint, skyTintWeight),
        CANDLE_WARM, candleFactor * 0.8);

      const frameHighlightColor = lerpColor(lerpColor([255,255,255], roomTint, 0.35 * (1 - candleFactor * 0.6)), CANDLE_WARM, candleFactor * 0.4);
      const frameHighlightAlpha = 0.08 + intensity * 0.08;
      const frameInsetAlpha = 0.45 - intensity * 0.10;
      const frameOuterAlpha = 0.55 - intensity * 0.10;

      const leadBase  = lerpColor(lerpColor(LEAD_BASE_NIGHT, LEAD_BASE_DAY, intensity), roomBase, 0.10);
      const leadDark1 = lerpColor(LEAD_DARK1_NIGHT, LEAD_DARK1_DAY, intensity);
      const leadDark2 = lerpColor(LEAD_DARK2_NIGHT, LEAD_DARK2_DAY, intensity);
      const leadHighlight = lerpColor(lerpColor(lerpColor(LEAD_HL_NIGHT, LEAD_HL_DAY, intensity), roomTint, glow * 0.4), CANDLE_WARM, candleFactor * 0.3);

      // Robin: same night->day ramp as the room, plus a golden-hour kiss on
      // the sunlit parts (crown, back, breast) that peaks with the horizon
      // glow at dawn/dusk and disappears at flat midday and full night.
      const robinGold      = glow * 0.5;
      const robinCrown     = lerpColor(lerpColor(ROBIN_CROWN_NIGHT, ROBIN_CROWN_DAY, intensity), GOLDEN_LIGHT, robinGold * 0.25);
      const robinBack      = lerpColor(lerpColor(ROBIN_BACK_NIGHT, ROBIN_BACK_DAY, intensity), GOLDEN_LIGHT, robinGold * 0.30);
      const robinBreast    = lerpColor(lerpColor(ROBIN_BREAST_NIGHT, ROBIN_BREAST_DAY, intensity), GOLDEN_LIGHT, robinGold * 0.45);
      const robinBreastDk  = lerpColor(lerpColor(ROBIN_BREAST_DK_NIGHT, ROBIN_BREAST_DK_DAY, intensity), GOLDEN_LIGHT, robinGold * 0.20);
      const robinBibEdge   = lerpColor(ROBIN_BIB_EDGE_NIGHT, ROBIN_BIB_EDGE_DAY, intensity);
      const robinBelly     = lerpColor(lerpColor(ROBIN_BELLY_NIGHT, ROBIN_BELLY_DAY, intensity), GOLDEN_LIGHT, robinGold * 0.20);
      const robinWing      = lerpColor(lerpColor(ROBIN_WING_NIGHT, ROBIN_WING_DAY, intensity), GOLDEN_LIGHT, robinGold * 0.15);
      const robinWingCov   = lerpColor(lerpColor(ROBIN_WINGCOV_NIGHT, ROBIN_WINGCOV_DAY, intensity), GOLDEN_LIGHT, robinGold * 0.20);
      const robinWingEdge  = lerpColor(ROBIN_WINGEDGE_NIGHT, ROBIN_WINGEDGE_DAY, intensity);
      const robinTail      = lerpColor(ROBIN_TAIL_NIGHT, ROBIN_TAIL_DAY, intensity);
      const robinBeak      = lerpColor(ROBIN_BEAK_NIGHT, ROBIN_BEAK_DAY, intensity);
      const robinLeg       = lerpColor(ROBIN_LEG_NIGHT, ROBIN_LEG_DAY, intensity);

      // Figure wood: sunlit by day (intensity), warmed toward the candle's
      // own colour as candleFactor rises at dusk/night. The lower body/edge
      // of the head stay closer to their base tone since they're less
      // exposed to either light source.
      const figureWoodTop = lerpColor(lerpColor(FIGURE_WOOD_TOP_NIGHT, FIGURE_WOOD_TOP_DAY, intensity), CANDLE_WARM, candleFactor * 0.55);
      const figureWoodMid = lerpColor(lerpColor(FIGURE_WOOD_MID_NIGHT, FIGURE_WOOD_MID_DAY, intensity), CANDLE_WARM, candleFactor * 0.35);
      const figureWoodBot = lerpColor(lerpColor(FIGURE_WOOD_BOT_NIGHT, FIGURE_WOOD_BOT_DAY, intensity), CANDLE_WARM, candleFactor * 0.15);
      const figureHeadTop = figureWoodTop;
      const figureHeadBot = lerpColor(lerpColor(FIGURE_HEAD_BOT_NIGHT, FIGURE_HEAD_BOT_DAY, intensity), CANDLE_WARM, candleFactor * 0.35);
      const figureDetail  = lerpColor(FIGURE_DETAIL_NIGHT, FIGURE_DETAIL_DAY, intensity);
      const figureGroove  = lerpColor(FIGURE_GROOVE_NIGHT, FIGURE_GROOVE_DAY, intensity);
      const figureNeckAlpha = (0.32 + (0.14 - 0.32) * intensity).toFixed(3);

      const body = document.body.style;
      body.setProperty('--room-light', `rgb(${roomBase.join(',')})`);
      body.setProperty('--room-glow', rgbaStr(roomBase, glowAlpha));
      body.setProperty('--room-edge', `rgba(0,0,0,${edgeAlpha.toFixed(3)})`);
      body.setProperty('--room-wash', rgbaStr(roomBase, washAlpha));
      body.setProperty('--room-brightness', brightness);
      body.setProperty('--frame-glow', rgbaStr(frameGlowColor, frameAlpha));
      body.setProperty('--ledge-top', `rgb(${ledgeTop.join(',')})`);
      body.setProperty('--ledge-bot', `rgb(${ledgeBot.join(',')})`);
      body.setProperty('--frame-top', `rgb(${frameTop.join(',')})`);
      body.setProperty('--frame-mid', `rgb(${frameMid.join(',')})`);
      body.setProperty('--frame-bot', `rgb(${frameBot.join(',')})`);
      body.setProperty('--frame-highlight', rgbaStr(frameHighlightColor, frameHighlightAlpha));
      body.setProperty('--frame-inset-shadow', `rgba(0,0,0,${frameInsetAlpha.toFixed(3)})`);
      body.setProperty('--frame-outer-shadow', `rgba(0,0,0,${frameOuterAlpha.toFixed(3)})`);
      body.setProperty('--lead-base', `rgb(${leadBase.join(',')})`);
      body.setProperty('--lead-dark1', `rgb(${leadDark1.join(',')})`);
      body.setProperty('--lead-dark2', `rgb(${leadDark2.join(',')})`);
      body.setProperty('--lead-highlight', `rgb(${leadHighlight.join(',')})`);

      body.setProperty('--robin-crown', `rgb(${robinCrown.join(',')})`);
      body.setProperty('--robin-back', `rgb(${robinBack.join(',')})`);
      body.setProperty('--robin-breast', `rgb(${robinBreast.join(',')})`);
      body.setProperty('--robin-breast-dk', `rgb(${robinBreastDk.join(',')})`);
      body.setProperty('--robin-bib-edge', `rgb(${robinBibEdge.join(',')})`);
      body.setProperty('--robin-belly', `rgb(${robinBelly.join(',')})`);
      body.setProperty('--robin-wing', `rgb(${robinWing.join(',')})`);
      body.setProperty('--robin-wing-dk', `rgb(${robinWingCov.join(',')})`);
      body.setProperty('--robin-wing-edge', `rgb(${robinWingEdge.join(',')})`);
      body.setProperty('--robin-tail', `rgb(${robinTail.join(',')})`);
      body.setProperty('--robin-beak', `rgb(${robinBeak.join(',')})`);
      body.setProperty('--robin-leg', `rgb(${robinLeg.join(',')})`);

      body.setProperty('--figure-wood-top', `rgb(${figureWoodTop.join(',')})`);
      body.setProperty('--figure-wood-mid', `rgb(${figureWoodMid.join(',')})`);
      body.setProperty('--figure-wood-bot', `rgb(${figureWoodBot.join(',')})`);
      body.setProperty('--figure-head-top', `rgb(${figureHeadTop.join(',')})`);
      body.setProperty('--figure-head-bot', `rgb(${figureHeadBot.join(',')})`);
      body.setProperty('--figure-detail', `rgb(${figureDetail.join(',')})`);
      body.setProperty('--figure-groove', `rgb(${figureGroove.join(',')})`);
      body.setProperty('--figure-neck-alpha', figureNeckAlpha);
    }

    const SUNRISE_START = 300, SUNRISE_FULL = 420, SUNSET_START = 1140, SUNSET_FULL = 1260;
    function sunOpacity(m) {
      if (m < SUNRISE_START) return 0;
      if (m < SUNRISE_FULL) return clamp((m - SUNRISE_START) / (SUNRISE_FULL - SUNRISE_START));
      if (m < SUNSET_START) return 1;
      if (m < SUNSET_FULL) return clamp(1 - (m - SUNSET_START) / (SUNSET_FULL - SUNSET_START));
      return 0;
    }

    const MOONRISE_START = 1170, MOONRISE_FULL = 1290, MOONSET_START = 240, MOONSET_FULL = 330;
    function moonOpacity(m) {
      if (m >= MOONRISE_START) return m < MOONRISE_FULL ? clamp((m - MOONRISE_START) / (MOONRISE_FULL - MOONRISE_START)) : 1;
      if (m < MOONSET_START) return 1;
      if (m < MOONSET_FULL) return clamp(1 - (m - MOONSET_START) / (MOONSET_FULL - MOONSET_START));
      return 0;
    }

    const STAR_IN_START = 1200, STAR_IN_FULL = 1290, STAR_OUT_START = 270, STAR_OUT_FULL = 360;
    function starOpacity(m) {
      if (m >= STAR_IN_START) return m < STAR_IN_FULL ? clamp((m - STAR_IN_START) / (STAR_IN_START)) : 1;
      if (m < STAR_OUT_START) return 1;
      if (m < STAR_OUT_FULL) return clamp(1 - (m - STAR_OUT_START) / (STAR_OUT_FULL - STAR_OUT_START));
      return 0;
    }

    function triangle(m, start, peak, end) {
      if (m <= start || m >= end) return 0;
      if (m <= peak) return (m - start) / (peak - start);
      return (end - m) / (end - peak);
    }
    function horizonGlowAmount(m) {
      return Math.max(triangle(m, 270, 360, 450), triangle(m, 1080, 1185, 1290));
    }

    function arcXY(f) {
      const x = 8 + f * 84;
      const y = 66 - Math.sin(Math.PI * f) * 50;
      return { x, y };
    }
    function fractionFor(m, start, end) { return clamp((m - start) / (end - start)); }

    function timeOfDayPhase(m) {
      // Mirrors the SUNRISE_/SUNSET_ thresholds above, so this stays in sync
      // with the sun/star fades automatically.
      if (m >= SUNRISE_START && m < SUNRISE_FULL) return 'dawn';
      if (m >= SUNRISE_FULL && m < SUNSET_START)  return 'day';
      if (m >= SUNSET_START && m < SUNSET_FULL)   return 'dusk';
      return 'night';
    }

    const TIME_OF_DAY_CLASSES = ['is-dawn', 'is-day', 'is-dusk', 'is-night'];
    function setTimeOfDayClass(phase) {
      const targetClass = 'is-' + phase;
      TIME_OF_DAY_CLASSES.forEach(cls => {
        document.body.classList.toggle(cls, cls === targetClass);
      });
      updateAmbienceTrack(phase);
    }

    function canonicalHour(hh) {
      if (hh < 3)  return { name: 'Matins',   gloss: 'The Night Watch' };
      if (hh < 6)  return { name: 'Lauds',    gloss: 'Praise at Daybreak' };
      if (hh < 9)  return { name: 'Prime',    gloss: 'The First Hour' };
      if (hh < 12) return { name: 'Terce',    gloss: 'Mid-Morning Prayer' };
      if (hh < 14) return { name: 'Sext',     gloss: 'Midday Prayer' };
      if (hh < 17) return { name: 'None',     gloss: 'Mid-Afternoon Prayer' };
      if (hh < 20) return { name: 'Vespers',  gloss: 'Evening Prayer' };
      return { name: 'Compline', gloss: 'Night Prayer' };
    }

    let debugMinutesOverride = null;

    function getLondonMinutes() {
      if (debugMinutesOverride !== null) {
        const hh = Math.floor(debugMinutesOverride / 60);
        const mm = debugMinutesOverride % 60;
        return { hh, mm, minutes: debugMinutesOverride };
      }
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(new Date());
      const hh = parseInt(parts.find(p => p.type === 'hour').value, 10);
      const mm = parseInt(parts.find(p => p.type === 'minute').value, 10);
      return { hh, mm, minutes: hh * 60 + mm };
    }

    function updateScene() {
      const { hh, minutes } = getLondonMinutes();

      const sky = getSkyColors(minutes);
      skyEl.style.setProperty('--c-top', `rgb(${sky.top.join(',')})`);
      skyEl.style.setProperty('--c-mid', `rgb(${sky.mid.join(',')})`);
      skyEl.style.setProperty('--c-bot', `rgb(${sky.bot.join(',')})`);

      const sOp = sunOpacity(minutes);
      const mOp = moonOpacity(minutes);
      const starOp = starOpacity(minutes);
      const glow = horizonGlowAmount(minutes);
      const phase = timeOfDayPhase(minutes);
      updateRoomLight(sky, glow, phase);

      sunEl.style.opacity = sOp;
      moonEl.style.opacity = mOp;
      starsField.style.opacity = starOp;
      horizonEl.style.opacity = glow;

      const sf = fractionFor(minutes, 270, 1290);
      const sPos = arcXY(sf);
      sunEl.style.left = sPos.x + '%';
      sunEl.style.top = sPos.y + '%';

      const mm2 = minutes < 600 ? minutes + 1440 : minutes;
      const mf = fractionFor(mm2, 1170, 1770);
      const mPos = arcXY(mf);
      moonEl.style.left = mPos.x + '%';
      moonEl.style.top = mPos.y + '%';

      const hour = canonicalHour(hh);
      hourLabelEl.textContent = hour.name;
      hourGlossEl.textContent = hour.gloss;

      setTimeOfDayClass(timeOfDayPhase(minutes));
    }

    function setDebugPhase(hh, mm) {
      debugMinutesOverride = hh * 60 + mm;
      updateScene();
    }
    function clearDebugPhase() {
      debugMinutesOverride = null;
      updateScene();
    }
    window.setDebugPhase = setDebugPhase;
    window.clearDebugPhase = clearDebugPhase;

    const timeParam = new URLSearchParams(window.location.search).get('time');
    if (timeParam && /^\d{1,2}:\d{2}$/.test(timeParam)) {
      const [oh, om] = timeParam.split(':').map(Number);
      if (oh >= 0 && oh < 24 && om >= 0 && om < 60) debugMinutesOverride = oh * 60 + om;
    }

    updateMoonPhase();
    updateScene();
    setInterval(updateScene, 15000);
    setInterval(updateMoonPhase, 60 * 60 * 1000);
  </script>
