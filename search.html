<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://linguadivina.uk/search.html" rel="canonical">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="/style-fold.css" rel="stylesheet">
<link href="/favicon.png" rel="icon" type="image/png">
<link rel="manifest" href="/manifest.json">
<link href="/style.css" rel="stylesheet">
<link rel="stylesheet" href="/style-fonts.css" media="print" onload="this.media='all'">
<script src="script.js"></script>
<title>Search</title>
</head>
<body>
<header class="header">
    <div class="site-title" role="heading" aria-level="1"><a href="https://god.thway.uk">Lingua Divina</a></div>
    <p class="hero-description">A Psychological Reading of Scripture</p>
    <button id="theme-toggle">◐</button>
    <script src="script-dark-light.js"></script>
</header>

<h1>Search</h1>
<div class="container">
    <input type="text" id="searchBox" placeholder="Site Search...">

    <div id="creation-section" style="display:none">
      <h2>Creation Vocabulary</h2>
      <ul id="creation-results"></ul>
    </div>

    <div id="other-section" style="display:none">
      <h2>Archived</h2>
      <ul id="other-results"></ul>
    </div>

    <div class="srch-series-link">
        <h2><a href="series-links.html">Articles A — Z</a></h2> 
    </div>
</div>

<div class="footer">© 2025 <a href="https://linguadivina.uk/">Lingua Divina</a>. All rights reserved.</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const searchBox = document.getElementById('searchBox');
  const creationSection = document.getElementById('creation-section');
  const otherSection = document.getElementById('other-section');
  const creationList = document.getElementById('creation-results');
  const otherList = document.getElementById('other-results');
  const CREATION_SUBFOLDER = 'creation';

  let searchIndex = [];

  // Load the index ONCE on page load
  try {
    const response = await fetch('searchIndex.json');
    searchIndex = await response.json();
  } catch (err) {
    console.error("Error loading search index:", err);
  }

  searchBox.addEventListener('input', function () {
    const query = this.value.trim().toLowerCase();
    
    // Reset lists on every keystroke to keep it clean
    creationList.innerHTML = '';
    otherList.innerHTML = '';
    
    if (!query || searchIndex.length === 0) {
      creationSection.style.display = 'none';
      otherSection.style.display = 'none';
      return;
    }

    // Filter the index we already have in memory
    const results = searchIndex.filter(page =>
      page.title.toLowerCase().includes(query) ||
      page.content.toLowerCase().includes(query)
    );

    const creationResults = results.filter(p => p.subfolder === CREATION_SUBFOLDER);
    const otherResults = results.filter(p => p.subfolder !== CREATION_SUBFOLDER);

    function appendResults(list, items) {
      items.forEach(page => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = page.url; 
        a.textContent = page.title;
        a.classList.add('noTag');
        li.appendChild(a);
        list.appendChild(li);
      });
    }

    if (creationResults.length > 0) {
      appendResults(creationList, creationResults);
      creationSection.style.display = 'block';
    } else { 
      creationSection.style.display = 'none'; 
    }

    if (otherResults.length > 0) {
      appendResults(otherList, otherResults);
      otherSection.style.display = 'block';
    } else { 
      otherSection.style.display = 'none'; 
    }
  });
});
</script>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-1XQ05KGVMN"></script>
<script src="script-ga.js" defer></script>
</body>
</html>
