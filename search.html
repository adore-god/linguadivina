<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="/style.css" rel="stylesheet">
<title>Search</title>
</head>
<body>
<div class="container">
    <h1>Search</h1>
    <input type="text" id="searchBox" placeholder="Start typing to search...">
    
    <div id="results-container">
        <div id="creation-section" style="display:none;">
            <h2 style="color: #2c3e50; border-bottom: 2px solid #eee;">The Creation Series</h2>
            <ul id="creation-results"></ul>
        </div>
        
        <div id="general-section" style="display:none;">
            <h2 style="color: #2c3e50; border-bottom: 2px solid #eee;">General Results</h2>
            <ul id="general-results"></ul>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const searchBox = document.getElementById('searchBox');
    const creationSection = document.getElementById('creation-section');
    const generalSection = document.getElementById('general-section');
    const creationList = document.getElementById('creation-results');
    const generalList = document.getElementById('general-results');

    async function loadIndex() {
        const response = await fetch('searchIndex.json');
        return await response.json();
    }

    searchBox.addEventListener('input', async function () {
        const query = this.value.trim().toLowerCase();
        
        // Clear previous results
        creationList.innerHTML = '';
        generalList.innerHTML = '';
        creationSection.style.display = 'none';
        generalSection.style.display = 'none';

        if (!query) return;

        const index = await loadIndex();
        
        const matches = index.filter(page => 
            page.title.toLowerCase().includes(query) || 
            page.content.toLowerCase().includes(query)
        );

        matches.forEach(page => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = page.url;
            a.textContent = page.title;
            li.appendChild(a);

            // Logic to put the result in the right bucket based on the JSON category
            if (page.category === 'Creation') {
                creationList.appendChild(li);
                creationSection.style.display = 'block';
            } else {
                generalList.appendChild(li);
                generalSection.style.display = 'block';
            }
        });
    });
});
</script>
</body>
</html>
